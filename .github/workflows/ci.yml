name: Pusula checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and resolve the Ceviz entry point
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet .
          cd /tmp && /tmp/venv/bin/python -c "
          from importlib.metadata import entry_points
          (ep,) = entry_points(group='ceviz.routers', name='pusula')
          router = ep.load()({'api_version': 1, 'agent': 'main', 'state_dir': '/tmp/pusula-state'})
          assert router.api_version == 1
          print('entry point ok:', ep.value)
          "
